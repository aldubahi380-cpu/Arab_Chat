services:
  - type: web
    name: arab-chat-web
    env: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT arab_chat.asgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: arab_chat.settings_production
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: BASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: WS_BASE_URL
        sync: false
      - key: SESSION_COOKIE_AGE
        value: "7776000"
      - key: FIREBASE_CONFIG
        sync: false
      - key: FCM_SERVER_KEY
        sync: false
      - key: FCM_WEB_PUSH_PUBLIC_KEY
        sync: false
      - key: FCM_WEB_PUSH_SENDER_ID
        sync: false
      - key: REDIS_URL
        fromService:
          name: arab-chat-redis
          type: redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: arab-chat-db
          property: connectionString

  - name: arab-chat-redis
    type: redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0

databases:
  - name: arab-chat-db
    plan: free

