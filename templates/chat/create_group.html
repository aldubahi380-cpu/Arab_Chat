{% extends 'base.html' %}

{% block title %}إنشاء مجموعة جديدة - عرب شات{% endblock %}

{% block extra_css %}
<style>
    .create-group-page {
        display: flex;
        justify-content: center;
    }

    .create-group-card {
        width: 100%;
        max-width: 640px;
        background: var(--whatsapp-white);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        overflow: hidden;
    }

    .create-group-header {
        background: var(--whatsapp-teal);
        color: var(--whatsapp-white);
        padding: 24px;
    }

    .create-group-title {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }

    .create-group-body {
        padding: 28px 32px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #111;
    }

    .required-indicator {
        color: #dc3545;
        margin-right: 4px;
    }

    .form-control {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--whatsapp-gray);
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: all 0.3s;
    }

    .form-control:focus {
        border-color: var(--whatsapp-teal);
        box-shadow: 0 0 0 3px rgba(7, 94, 84, 0.1);
    }

    textarea.form-control {
        min-height: 120px;
        resize: vertical;
    }

    .form-help {
        font-size: 13px;
        color: var(--whatsapp-dark-gray);
        margin-top: 6px;
    }

    .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 32px;
    }

    .btn {
        flex: 1;
        padding: 12px 24px;
        border-radius: 25px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        border: none;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-primary {
        background: var(--whatsapp-green);
        color: var(--whatsapp-white);
    }

    .btn-primary:hover {
        background: var(--whatsapp-dark-green);
    }

    .btn-secondary {
        background: var(--whatsapp-gray);
        color: #111;
    }

    .btn-secondary:hover {
        background: var(--whatsapp-dark-gray);
    }

    @media (max-width: 768px) {
        .create-group-body {
            padding: 24px;
        }

        .form-actions {
            flex-direction: column;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-shell create-group-page">
    <div class="create-group-card">
        <div class="create-group-header">
            <h2 class="create-group-title"><i class="fas fa-plus-circle"></i> إنشاء مجموعة جديدة</h2>
        </div>
        <div class="create-group-body">
            <form method="POST" id="createGroupForm">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label" for="name">
                        <span class="required-indicator">*</span>اسم المجموعة
                    </label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        class="form-control" 
                        placeholder="أدخل اسم المجموعة"
                        required
                        maxlength="100"
                    >
                    <div class="form-help">اسم المجموعة سيظهر لجميع المستخدمين</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">
                        الوصف (اختياري)
                    </label>
                    <textarea 
                        id="description" 
                        name="description" 
                        class="form-control" 
                        placeholder="اكتب وصفاً للمجموعة..."
                        maxlength="500"
                    ></textarea>
                    <div class="form-help">وصف مختصر عن المجموعة (حد أقصى 500 حرف)</div>
                </div>

                <div class="form-actions">
                    <a href="{% url 'groups' %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> إلغاء
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-check"></i> إنشاء المجموعة
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('createGroupForm')?.addEventListener('submit', function(e) {
    const nameInput = document.getElementById('name');
    const name = nameInput.value.trim();
    
    if (!name) {
        e.preventDefault();
        alert('يرجى إدخال اسم المجموعة');
        nameInput.focus();
        return false;
    }
    
    if (name.length < 3) {
        e.preventDefault();
        alert('اسم المجموعة يجب أن يكون 3 أحرف على الأقل');
        nameInput.focus();
        return false;
    }
});
</script>
{% endblock %}
