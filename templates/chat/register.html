{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="register-container">
    <div class="register-content">
        <div class="register-header">
            <h1><i class="fas fa-user-plus"></i> إنشاء حساب جديد</h1>
            <p class="subtitle">أدخل بياناتك للبدء</p>
        </div>
        
        <div class="register-body">
            <form method="post" action="{% url 'register' %}" id="registerForm" novalidate>
                {% csrf_token %}
                
                {% if error %}
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-circle"></i> {{ error }}
                </div>
                {% endif %}
                
                {% if success %}
                <div class="alert alert-success">
                    <i class="fas fa-check-circle"></i> {{ success }}
                </div>
                {% endif %}
                
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> اسم المستخدم
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-control" 
                        placeholder="أدخل اسم المستخدم"
                        required
                        minlength="3"
                        maxlength="50"
                        autocomplete="username"
                    >
                    <small class="form-text">يجب أن يكون الاسم بين 3 و 50 حرفاً</small>
                </div>
                
                <div class="form-group">
                    <label for="phone">
                        <i class="fas fa-phone"></i> رقم الهاتف
                    </label>
                    <input 
                        type="text" 
                        id="phone" 
                        name="phone" 
                        class="form-control" 
                        placeholder="أدخل رقم الهاتف (أي رقم مقبول)"
                        required
                        autocomplete="tel"
                    >
                    <small class="form-text">يمكنك إدخال أي رقم (حتى غير حقيقي)</small>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-register" id="submitBtn">
                        <i class="fas fa-check"></i> إنشاء الحساب
                    </button>
                    <a href="{% url 'terms' %}" class="btn-back">
                        <i class="fas fa-arrow-right"></i> العودة للشروط
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .register-container {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .register-content {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        max-width: 500px;
        width: 100%;
        overflow: hidden;
    }
    
    .register-header {
        background: linear-gradient(135deg, var(--whatsapp-teal) 0%, #128C7E 100%);
        color: white;
        padding: 30px;
        text-align: center;
    }
    
    .register-header h1 {
        margin: 0 0 10px 0;
        font-size: 28px;
        font-weight: bold;
    }
    
    .register-header .subtitle {
        margin: 0;
        opacity: 0.9;
        font-size: 16px;
    }
    
    .register-body {
        padding: 30px;
        direction: rtl;
    }
    
    .form-group {
        margin-bottom: 25px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .form-group label i {
        color: var(--whatsapp-teal);
    }
    
    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e9ecef;
        border-radius: 10px;
        font-size: 16px;
        transition: all 0.3s ease;
        direction: rtl;
    }
    
    .form-control:focus {
        outline: none;
        border-color: var(--whatsapp-teal);
        box-shadow: 0 0 0 3px rgba(18, 140, 126, 0.1);
    }
    
    .form-text {
        display: block;
        margin-top: 5px;
        font-size: 13px;
        color: #666;
    }
    
    .alert {
        padding: 12px 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .alert-danger {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
    
    .alert-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    
    .form-actions {
        margin-top: 30px;
    }
    
    .btn-register {
        width: 100%;
        padding: 15px;
        background: var(--whatsapp-teal);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 15px;
    }
    
    .btn-register:hover:not(:disabled) {
        background: #128C7E;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    
    .btn-register:disabled {
        background: #ccc;
        cursor: not-allowed;
        opacity: 0.6;
    }
    
    .btn-back {
        display: block;
        text-align: center;
        color: var(--whatsapp-teal);
        text-decoration: none;
        padding: 10px;
        font-size: 16px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    
    .btn-back:hover {
        color: #128C7E;
        text-decoration: underline;
    }
    
    @media (max-width: 768px) {
        .register-container {
            padding: 10px;
        }
        
        .register-header {
            padding: 20px;
        }
        
        .register-header h1 {
            font-size: 22px;
        }
        
        .register-body {
            padding: 20px;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        
        form.addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const phone = document.getElementById('phone').value.trim();
            
            if (!username || username.length < 3) {
                e.preventDefault();
                alert('يجب إدخال اسم مستخدم صحيح (3 أحرف على الأقل)');
                return;
            }
            
            if (!phone) {
                e.preventDefault();
                alert('يجب إدخال رقم الهاتف');
                return;
            }
            
            // Disable button during submission
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري إنشاء الحساب...';
        });
    });
</script>
{% endblock %}
