<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واتساب الدوبحي - بلا اتصال</title>
    <style>
      body {
        font-family: 'Segoe UI', 'Tahoma', sans-serif;
        background: #F0F2F5;
        color: #075E54;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
      }
      .card {
        background: #FFFFFF;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        max-width: 420px;
        padding: 2.5rem 2rem;
      }
      h1 {
        font-size: 1.6rem;
        margin-bottom: 1rem;
      }
      p {
        line-height: 1.8;
        color: #54656F;
      }
      .retry-btn {
        margin-top: 2rem;
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        background: #25D366;
        color: #fff;
        padding: 0.8rem 1.6rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        box-shadow: 0 6px 15px rgba(37, 211, 102, 0.25);
      }
      .retry-btn i {
        font-style: normal;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🙈 أوف لاين حالياً</h1>
      <p>
        لا يمكن الوصول إلى واتساب الدوبحي لأن جهازك غير متصل بالإنترنت.
        بمجرد عودة الاتصال سيُعاد تحميل التطبيق تلقائياً.
      </p>
      <a class="retry-btn" href="/" rel="noreferrer">
        <i>↻</i>
        إعادة المحاولة
      </a>
    </div>
  </body>
</html>
